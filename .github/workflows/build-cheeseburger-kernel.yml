# 在 GitHub 的 macOS runner 上复现 DinnerABC/UniXNU-cheeseburger 的 P4 内核构建。
#
# 用法：
#   1. 在你自己账号下建一个空仓库（public，Actions 免费）
#   2. 把本文件放到 .github/workflows/build-cheeseburger-kernel.yml
#   3. 推到 main 分支
#   4. 仓库页面 → Actions → "build cheeseburger kernel" → Run workflow
#   5. 跑完在页面底部下载 artifact：cheeseburger-kernel
#
# 为什么需要这个：上游两个 workflow 都故意不编内核（P1 只编 EFI 包，
# P2 的 kernel job 只是 readiness 预检），真实内核构建只在作者的 Mac 上做过。
#
# 参考：docs/P4_XNU_BUILD.md，scripts/p4-{fetch,prepare-xnu,build-xnu,export-kernel}
name: build cheeseburger kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: 取设备仓（DinnerABC/UniXNU-cheeseburger，固定提交）
        uses: actions/checkout@v4
        with:
          repository: DinnerABC/UniXNU-cheeseburger
          ref: c5463363de7ca0ad541b8132f29c7f0a3cef718c
          path: device
          persist-credentials: false

      - name: 取上游 UniXNU（p4-fetch.py 要求的固定提交）
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: b6ae99c17194e6a18fd819d3148e69fe405e91fc
          path: upstream/UniXNU
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装构建工具（p4-env.sh 期望 /opt/homebrew 路径）
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install llvm lld make unifdef dtc cmake ninja
          for f in llvm lld unifdef; do echo "$(brew --prefix "$f")/bin" >> "$GITHUB_PATH"; done
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: 记录环境（Xcode 版本决定 iig 是否存在）
        run: |
          set -euo pipefail
          xcodebuild -version || true
          xcode-select -p
          ls /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/iig || \
            echo "::warning::iig 不存在，p4-build-xnu.sh 的 assert 会失败"

      - name: 抓取固定版本源码（xnu / libplatform / libdispatch / AvailabilityVersions）
        run: |
          set -euo pipefail
          cd device
          mkdir -p .work/tmp out/p4
          python3 scripts/p4-fetch.py

      - name: 建立 XNU 工作树（p4-prepare-xnu.py 要求 .cache/xnu-work）
        run: |
          set -euo pipefail
          cd device/.work/p4-unixnu
          mkdir -p .cache
          if [ ! -d .cache/xnu-work/.git ]; then
            git clone --shared refer/xnu .cache/xnu-work
          fi
          ls -d .cache/xnu-work/.git
          # prelink 索引 ABI 的补丁来自这个 kit（UniXNU 的子模块默认是空的）
          if [ -d kits/NativePrelink ] && [ -z "$(ls -A kits/NativePrelink 2>/dev/null)" ]; then
            git clone --depth 1 https://github.com/UniXNU/NativePrelink.git kits/NativePrelink
          fi
          ls kits/NativePrelink/patches 2>/dev/null || true

      - name: 打 4K/MSM8998 补丁并生成机器头
        run: |
          set -euo pipefail
          cd device
          python3 scripts/p4-prepare-xnu.py

      - name: 取本仓库（CI 工具：availability.pl）
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: 解包 fakeroot（仓库内自带，与 UniXNU 构建期望的布局一致）
        run: |
          set -euo pipefail
          cd device/.work/p4-unixnu
          rm -rf .cache/fakeroot
          mkdir -p .cache
          tar xzf "$GITHUB_WORKSPACE/ci/ci/tools/fakeroot.tar.gz" -C .cache
          ls -l .cache/fakeroot/usr/local/libexec/availability.pl
          du -sh .cache/fakeroot
          # iig 通过 SDKROOT(iphoneos SDK) 找 DriverKit，而 iPhoneOS SDK 里没有；
          # 一次性 runner 上把 fakeroot 的 framework 软链进去。
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for fw in DriverKit IOKit System Kernel; do
            if [ -d ".cache/fakeroot/System/Library/Frameworks/$fw.framework" ] && [ ! -e "$SDK/System/Library/Frameworks/$fw.framework" ]; then
              sudo ln -sfn "$PWD/.cache/fakeroot/System/Library/Frameworks/$fw.framework" "$SDK/System/Library/Frameworks/$fw.framework"
              echo "linked $fw.framework into iPhoneOS SDK"
            fi
          done
          ls -l "$SDK/System/Library/Frameworks/DriverKit.framework/Headers/IOTypes.h" | head -1

      - name: 安装 xcrun shim（让 --sdk iphoneos 指向 fakeroot，与 Linux 构建一致）
        run: |
          set -euo pipefail
          SHIM="$RUNNER_TEMP/xcrun-shim"
          mkdir -p "$SHIM"
          cat > "$SHIM/xcrun" <<'EOF'
          #!/bin/bash
          # UniXNU 在 Linux 上就是这样把 SDKROOT 指到 fakeroot 的：
          # 构建只需要 fakeroot 里的头文件和 kernel 库，不需要真 SDK。
          FAKE="${GITHUB_WORKSPACE}/device/.work/p4-unixnu/.cache/fakeroot"
          if [ "${1:-}" = "--sdk" ] || [ "${1:-}" = "-sdk" ]; then
            case "${3:-}${2:-}" in
              *--show-sdk-path|-*show-sdk-path) echo "$FAKE"; exit 0 ;;
              *--show-sdk-version*) echo "17.0"; exit 0 ;;
            esac
          fi
          exec /usr/bin/xcrun "$@"
          EOF
          chmod +x "$SHIM/xcrun"
          echo "$SHIM" >> "$GITHUB_PATH"
          echo "shim installed: $SHIM/xcrun"
          cat "$SHIM/xcrun"

      - name: 检查 Xcode 工具链（iig 是 p4-build-xnu.sh 的硬断言）
        run: |
          set -euo pipefail
          TC="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          ls -l "$TC/iig" || echo "::warning::iig 不存在，编译会失败"
          xcodebuild -version

      - name: 编译 XNU（MSM8998 / 4K）
        run: |
          set -euo pipefail
          cd device
          bash scripts/p4-build-xnu.sh

      - name: 导出内核候选
        run: |
          set -euo pipefail
          cd device
          python3 scripts/p4-export-kernel.py

      - name: 上传内核与全部日志（成功或失败都传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheeseburger-kernel
          path: |
            device/out/p4/**
            device/out/cheeseburger/**
            device/.work/p4-unixnu/build/xnu/ios-obj/**/mach.*
          if-no-files-found: warn
          retention-days: 14
